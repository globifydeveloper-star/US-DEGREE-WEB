name: CI

on:
  pull_request:
  push:
    branches: [production, dev2]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` over `npm install` so the lockfile is authoritative and a
      # drifting package.json fails here rather than resolving silently.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build must run without any secrets configured. This is deliberate:
      # it proves the app builds in a clean environment and that no module
      # throws at import time for a missing env var. API_URL is intentionally
      # absent — getBackendBaseUrl() only throws at request time, so a missing
      # backend URL can never break the build, only a misconfigured deploy.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
